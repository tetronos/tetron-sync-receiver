[package]
name = "tetron-sync-receiver"
version = "0.15.1"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
description = "Headless home-side rsync receiver for tetron-mobile-sync, managed over the tetron mesh"
repository = "https://github.com/tetronos/tetron-sync-receiver"

[[bin]]
name = "tetron-sync-receiver"
path = "src/main.rs"

[dependencies]
# Pinned to a tetron core release tag of this minor, not floating on main: a
# bare git dependency lets Cargo.lock freeze any commit, so suite clients
# drifted to different protocol revisions. contrib/bump-proto.sh moves the
# tag; a tetron release opens that bump as a pull request (bump-proto.yml);
# contrib/check-suite-deps.sh guards it. The wire types still use
# #[serde(default)], so binaries of the same minor keep working together.
tetron-proto = { git = "https://github.com/tetronos/tetron", tag = "v0.15.6" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
